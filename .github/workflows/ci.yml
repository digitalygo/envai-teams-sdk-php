# CI for digitalygo/atp-php-sdk (quality gate, section 30 of the project
# document).
#
# Action pinning: third-party actions are pinned by major-version tag
# (@v2, @v4). Full-SHA pinning guarantees immutability but turns every
# bump into a manual chore; tag pinning is the accepted tradeoff for
# this repository.
#
# Composer caching: composer.lock is gitignored, so the cache key is
# derived from composer.json only.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (PHP 8.2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          # Matches composer.json require plus the suggested PDO drivers.
          # sqlite3 covers pdo_sqlite on Ubuntu runners (same package).
          extensions: curl, mbstring, sodium, sqlite3, pdo_mysql, pdo_pgsql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse

      - name: Security audit (Composer)
        # Project document section 30 requires composer audit to be green;
        # advisories fail the gate, so the step stays strict.
        run: composer audit
        continue-on-error: false

  test:
    name: Tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      # Format matches PdoMysqlSyncStateStoreContractTest /
      # PdoPgsqlSyncStateStoreContractTest: DSN in the *_DSN var, optional
      # credentials in the dedicated USER / PASSWORD vars.
      ENVAI_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=test
      ENVAI_TEST_MYSQL_USER: test
      ENVAI_TEST_MYSQL_PASSWORD: test
      ENVAI_TEST_PGSQL_DSN: pgsql:host=127.0.0.1;port=5432;dbname=test
      ENVAI_TEST_PGSQL_USER: test
      ENVAI_TEST_PGSQL_PASSWORD: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, mbstring, sodium, sqlite3, pdo_mysql, pdo_pgsql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPUnit (full suite)
        # The MySQL and PostgreSQL contract suites run here because the
        # ENVAI_TEST_MYSQL_DSN / ENVAI_TEST_PGSQL_DSN vars are set; the
        # same tests skip locally when those vars are unset.
        run: vendor/bin/phpunit
